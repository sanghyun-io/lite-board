<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lite-board</title>
<style>
:root{--bg:#f6f5f2;--dot:#d6d3cc;--panel:#fff;--ink:#22242a;--mut:#7a7e87;--line:#e4e2dd;--acc:#0f766e;--accbg:#e3f1ef;--sel:#0f766e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--dot:#44474f;--panel:#222429;--ink:#e8e8ea;--mut:#9a9ea7;--line:#34363c;--acc:#5eead4;--accbg:#173c38;--sel:#5eead4}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;touch-action:none;background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.3px)}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--mut);pointer-events:none;user-select:none;line-height:1.7}
#hint b{display:block;font-size:17px;color:var(--ink);font-weight:600;margin-bottom:4px}
#hint kbd{font:inherit;padding:0 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
#cv{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.pn{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 14px #0000001c;display:flex;align-items:center;gap:2px;padding:4px}
button{font:inherit;color:inherit;background:none;border:0;border-radius:8px;cursor:pointer;padding:6px;min-width:30px;min-height:30px}
button:hover{background:var(--accbg)}
button[aria-pressed=true]{background:var(--acc);color:var(--panel)}
.ic svg{width:20px;height:20px;display:block;margin:auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tools{top:10px;left:50%;transform:translateX(-50%)}
#menu{top:10px;left:10px}
#menu b{padding:0 8px 0 6px;letter-spacing:.02em;font-weight:650}
#menu b i{color:var(--acc);font-style:normal}
#menu button{font-size:12px;padding:6px 8px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:3px 3px}
#style{top:10px;right:10px;width:184px;flex-direction:column;align-items:stretch;padding:8px;gap:8px}
#style h4{margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.sw button{min-width:0;min-height:0;height:24px;padding:0;display:grid;place-items:center}
.sw span{width:16px;height:16px;border-radius:50%;display:block}
.sw button[aria-pressed=true]{background:var(--accbg);outline:2px solid var(--acc)}
.seg{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.seg button{flex:1;min-width:0;min-height:26px;padding:3px 1px;font-size:11px}
#zoom{bottom:10px;left:10px}
#zl{min-width:52px;font-variant-numeric:tabular-nums;font-size:12px}
#tabs{bottom:10px;left:300px;gap:2px;max-width:calc(100vw - 20px)}
#tabl{display:flex;gap:2px;overflow-x:auto;min-width:0;position:relative;scrollbar-width:thin}
.tb{display:flex;align-items:center;flex:none;border-radius:8px}
.tb.on,.tb:hover{background:var(--accbg)}.tb>button:hover{background:none}.tb .tx:hover{color:var(--ink)}
.tb>button[role=tab]{touch-action:pan-y;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:6px 4px 6px 10px}
.tb.on>button[role=tab]{color:var(--acc);font-weight:650}
.tb .tx{min-width:20px;min-height:20px;padding:0;margin-right:4px;font-size:14px;line-height:1;color:var(--mut);visibility:hidden}
.tb:hover .tx,.tb.on .tx,.tb .tx:focus-visible{visibility:visible}
.tb.drg{background:var(--panel);box-shadow:0 2px 10px #0000002e;position:relative;z-index:1;opacity:.9}
.tin{font:inherit;font-size:12px;width:90px;margin:0 2px;padding:5px 8px;border:1px solid var(--acc);border-radius:6px;background:var(--bg);color:var(--ink);outline:none}
#tabAdd{flex:none;font-size:16px;line-height:1}
#toast{position:fixed;left:50%;bottom:62px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;z-index:9;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#c2352f;color:#fff}
#ta{position:fixed;display:none;z-index:4;margin:0;border:0;outline:1.5px dashed var(--sel);background:transparent;resize:none;overflow:hidden;line-height:1.3;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
.sb{fill:none;stroke:var(--sel);stroke-width:1.25}
.so{fill:none;stroke:var(--sel);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.hd{fill:var(--panel);stroke:var(--sel);stroke-width:1.5}
.mq{fill:var(--sel);fill-opacity:.07;stroke:var(--sel);stroke-width:1}
@media (max-width:760px){#style{top:auto;bottom:104px;width:170px}#tools{top:56px}}
</style>
</head>
<body>
<div id="stage"><svg id="cv" role="img" aria-label="Canvas"><g id="world"></g><g id="ov"></g></svg></div>
<div id="menu" class="pn" role="toolbar" aria-label="File menu">
<b>lite<i>·</i>board</b>
<button id="mNew" aria-label="New document" title="New document">New</button>
<button id="mOpen" aria-label="Open file" title="Open file (.liteboard / .json / .tldr)">Open</button>
<span class="sep"></span>
<button id="mJson" aria-label="Export .liteboard" title="Export .liteboard (Ctrl+S)">Export .liteboard</button>
<button id="mTldr" aria-label="Export .tldr" title="Export .tldr (tldraw compatible)">.tldr</button>
<button id="mSvg" aria-label="Export SVG" title="Export SVG">SVG</button>
<button id="mPng" aria-label="Export PNG" title="Export PNG">PNG</button>
<span class="sep"></span>
<button id="mShare" aria-label="Share link" title="공유 링크 복사 (보드 전체가 URL에 담김, 서버 저장 없음)"><b>Share</b></button>
</div>
<div id="tools" class="pn ic" role="toolbar" aria-label="Tools"></div>
<div id="style" class="pn" aria-label="Style panel">
<h4>Color</h4><div class="sw" id="pColor"></div>
<h4>Fill</h4><div class="seg" id="pFill"></div>
<h4>Dash</h4><div class="seg" id="pDash"></div>
<h4>Size</h4><div class="seg" id="pSize"></div>
</div>
<div id="zoom" class="pn ic" aria-label="View controls">
<button id="bUndo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7 4L3 8l4 4M3 8h9a5 5 0 0 1 0 10H9"/></svg></button>
<button id="bRedo" aria-label="Redo (Ctrl+Shift+Z)" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20"><path d="M13 4l4 4-4 4M17 8H8a5 5 0 0 0 0 10h3"/></svg></button>
<span class="sep"></span>
<button id="bOut" aria-label="Zoom out (-)" title="Zoom out (-)"><svg viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button>
<button id="zl" aria-label="Reset zoom (0)" title="Reset zoom to 100% (0)">100%</button>
<button id="bIn" aria-label="Zoom in (+)" title="Zoom in (+)"><svg viewBox="0 0 20 20"><path d="M5 10h10M10 5v10"/></svg></button>
<button id="bFit" aria-label="Zoom to fit (Shift+1)" title="Zoom to fit (Shift+1)"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
</div>
<div id="tabs" class="pn" aria-label="Pages"><div id="tabl" role="tablist" aria-label="Pages"></div><button id="tabAdd" aria-label="Add page" title="페이지 추가">+</button></div>
<textarea id="ta" aria-label="Edit text" spellcheck="false"></textarea>
<div id="hint" hidden><b>빈 보드입니다</b>위 도구를 골라 그려 보세요<br><kbd>R</kbd> 사각형 · <kbd>D</kbd> 그리기 · <kbd>T</kbd> 텍스트 · <kbd>N</kbd> 노트<br>파일은 끌어다 놓거나 Open으로 열 수 있습니다</div>
<input id="file" type="file" accept=".liteboard,.json,.tldr" hidden aria-label="File input">
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const COLORS=['black','grey','light-violet','violet','blue','light-blue','yellow','orange','green','light-green','light-red','red'];
const FILLS=['none','semi','solid'],DASHES=['solid','draw','dashed','dotted'],SIZES=['s','m','l','xl'];
const TYPES=['rect','ellipse','draw','arrow','line','text','note'];
const PAL_L={black:'#1e1f24',grey:'#868b94','light-violet':'#c58df0',violet:'#7c3fc9',blue:'#2f5fe0','light-blue':'#3fa7e8',yellow:'#e2a600',orange:'#ec7420',green:'#178a4c','light-green':'#5cc25a','light-red':'#f07285',red:'#d9302c'};
const PAL_D=Object.assign({},PAL_L,{black:'#e9e9ec',grey:'#9ba0a8',violet:'#a06ee8',blue:'#5b82f0',green:'#2fae68'});
const SW={s:2,m:3.5,l:5.5,xl:9},FS={s:18,m:24,l:34,xl:46},LH=1.3;
const FONT='ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif';
const KEY='lite-board:v1';
const HP={nw:[0,0],n:[.5,0],ne:[1,0],e:[1,.5],se:[1,1],s:[.5,1],sw:[0,1],w:[0,.5]};
const CUR={nw:'nwse',se:'nwse',ne:'nesw',sw:'nesw',n:'ns',s:'ns',e:'ew',w:'ew'};
const TOOLS=[
['select','Select','V','<path d="M5 3l11 6.2-5.2 1.3L8.6 16z"/>'],
['hand','Hand','H','<path d="M7 11V5.6a1.2 1.2 0 0 1 2.4 0V10M9.4 9.6V4.2a1.2 1.2 0 0 1 2.4 0v5.4M11.8 9.6V5.4a1.2 1.2 0 0 1 2.4 0v5.8c0 3-2 5-4.6 5H9c-1.9 0-3-1-4-2.5L3.6 11.2a1.2 1.2 0 0 1 2-1.3L7 11.6"/>'],
['draw','Draw','D','<path d="M3 14.5c2-6.5 4-6.5 5-2.2s3 4 4.2-.8 3-5.5 4.8-2"/>'],
['eraser','Eraser','E','<path d="M4.5 12.5l7-7 4.5 4.5-6 6H8z"/><path d="M8.5 16h8"/>'],
['arrow','Arrow','A','<path d="M4 16L16 4M9.5 4H16v6.5"/>'],
['line','Line','L','<path d="M4 16L16 4"/><circle cx="4" cy="16" r="1.2"/><circle cx="16" cy="4" r="1.2"/>'],
['text','Text','T','<path d="M5 5h10M10 5v11M8 16h4"/>'],
['note','Note','N','<path d="M4 4h12v8l-4 4H4z"/><path d="M12 16v-4h4"/>'],
['rect','Rectangle','R','<rect x="3.5" y="5" width="13" height="10" rx="1.5"/>'],
['ellipse','Ellipse','O','<ellipse cx="10" cy="10" rx="7" ry="5.5"/>']];
const TKEY={};TOOLS.forEach(t=>TKEY[t[2].toLowerCase()]=t[0]);

let shapes=[],cam={x:0,y:0,z:1},sel=new Set(),tool='select',style={color:'black',fill:'none',dash:'solid',size:'m'};
let undoS=[],redoS=[],clip=null,pasteN=0,drag=null,ed=null,spaceDown=false,erasing=new Set(),pinch=null;
const ptrs=new Map();
const svg=$('#cv'),world=$('#world'),ov=$('#ov'),stage=$('#stage'),ta=$('#ta');
const mq=matchMedia('(prefers-color-scheme: dark)');
const cl=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'s_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const f=n=>Math.round(n*100)/100;
const esc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]|[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=id=>shapes.find(s=>s.id===id);
const selected=()=>shapes.filter(s=>sel.has(s.id));
/* ---------- pages: `shapes`/`cam` always alias the current page; sync() writes them back ---------- */
const pid=()=>'p_'+uid().slice(2);
const mkPage=name=>({id:pid(),name,shapes:[],camera:{x:0,y:0,z:1}});
let pages=[mkPage('Page 1')],cur=pages[0].id,ren=null;const camMem=new Map();shapes=pages[0].shapes;cam=pages[0].camera;
const pg=()=>pages.find(p=>p.id===cur);
function sync(){const p=pg();if(p){p.shapes=shapes;p.camera=cam}}
function setCur(id){cur=id;const p=pg();shapes=p.shapes;if(p.camera)cam=p.camera;else{cam=p.camera={x:0,y:0,z:1};if(shapes.length)fit()}}
const snap=c=>{sync();return JSON.stringify({c:c||cur,p:pages.map(p=>({id:p.id,name:p.name,shapes:p.shapes}))})};
function mark(){undoS.push(snap());if(undoS.length>200)undoS.shift();redoS=[]}
function pruneSel(){for(const id of [...sel])if(!get(id))sel.delete(id)}
function restore(j){
  sync();const o=JSON.parse(j),prev=cur,was=new Set(shapes.map(s=>s.id)),cams=new Map(pages.map(p=>[p.id,p.camera]));
  pages=o.p.map(p=>(p.camera=cams.get(p.id)||camMem.get(p.id)||null,p));
  const has=id=>pages.some(p=>p.id===id);
  setCur(has(o.c)?o.c:has(cur)?cur:pages[0].id);
  if(cur!==prev)sel.clear();else{pruneSel();if(!sel.size)for(const s of shapes)if(!was.has(s.id))sel.add(s.id)}
  renderTabs();changed();
}
/* the counter-snapshot remembers the page the change happened on (the target's page) when that page exists on both sides; else the current page (page add/delete) */
function step(from,to){if(!from.length)return;const j=from.pop(),o=JSON.parse(j);to.push(snap(o.p.some(p=>p.id===cur)&&pages.some(p=>p.id===o.c)?o.c:cur));restore(j)}
function undo(){step(undoS,redoS)}
function redo(){step(redoS,undoS)}

/* ---------- toast ---------- */
let tt=0;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className=err?'err':'',err?4500:2800)}

/* ---------- text measure ---------- */
const mctx=document.createElement('canvas').getContext('2d');let mfont='';
function mw(s,fs){const fo=fs+'px '+FONT;if(fo!==mfont){mctx.font=fo;mfont=fo}return mctx.measureText(s).width}
function wrap(t,W,fs){
  const out=[];W=Math.max(W,fs);
  for(const para of t.split('\n')){
    if(mw(para,fs)<=W){out.push(para);continue}
    let line='';
    for(const w of para.split(/(\s+)/)){
      if(!w)continue;
      const tl=line+w;
      if(line&&mw(tl,fs)>W){out.push(line.replace(/\s+$/,''));line=w.replace(/^\s+/,'')}else line=tl;
      while(line.length>1&&mw(line,fs)>W){let lo=1,hi=line.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(mw(line.slice(0,m),fs)<=W)lo=m;else hi=m-1}out.push(line.slice(0,lo));line=line.slice(lo)}
    }
    out.push(line);
  }
  return out;
}
function lay(s){
  const fs=FS[s.style.size]||24,t=s.text||'';let lines;
  if(s.type==='text'){
    if(s.wrap)lines=wrap(t,s.w-8,fs);
    else{lines=t.split('\n');s.w=Math.max(24,...lines.map(l=>mw(l,fs)))+8}
    s.h=Math.max(1,lines.length)*fs*LH+8;
    return{lines,fs};
  }
  if(s.type==='note'){const n=fs*.8;lines=t?wrap(t,s.w-24,n):[];s.h=Math.max(s.h,lines.length*n*LH+24);return{lines,fs:n}}
  return{lines:t?wrap(t,s.w-16,fs):[],fs};
}

/* ---------- geometry ---------- */
function bb(s){
  if(s.type==='draw'){let a=1/0,b=1/0,c=-1/0,d=-1/0;for(const[x,y]of s.points){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y}return{x:a,y:b,w:c-a,h:d-b}}
  if(s.start){const a=s.start,b=s.end;return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)}}
  return{x:s.x,y:s.y,w:s.w,h:s.h};
}
function union(list){let a=1/0,b=1/0,c=-1/0,d=-1/0;for(const s of list){const r=bb(s);a=Math.min(a,r.x);b=Math.min(b,r.y);c=Math.max(c,r.x+r.w);d=Math.max(d,r.y+r.h)}return{x:a,y:b,w:c-a,h:d-b}}
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function hit(s,p,tol){
  tol+=(SW[s.style.size]||3)/2;
  if(s.type==='draw'){const P=s.points;if(P.length===1)return Math.hypot(p.x-P[0][0],p.y-P[0][1])<=tol;for(let i=1;i<P.length;i++)if(segD(p.x,p.y,P[i-1][0],P[i-1][1],P[i][0],P[i][1])<=tol)return true;return false}
  if(s.start)return segD(p.x,p.y,s.start.x,s.start.y,s.end.x,s.end.y)<=tol;
  const solid=s.type==='text'||s.type==='note'||s.style.fill!=='none'||!!s.text;
  if(s.type==='ellipse'){const rx=Math.max(s.w/2,1),ry=Math.max(s.h/2,1),k=Math.hypot((p.x-s.x-rx)/rx,(p.y-s.y-ry)/ry);return(k<=1&&solid)||Math.abs(k-1)*Math.min(rx,ry)<=tol}
  const inX=p.x>=s.x-tol&&p.x<=s.x+s.w+tol,inY=p.y>=s.y-tol&&p.y<=s.y+s.h+tol;
  if(!inX||!inY)return false;if(solid)return true;
  return Math.min(Math.abs(p.x-s.x),Math.abs(p.x-s.x-s.w),Math.abs(p.y-s.y),Math.abs(p.y-s.y-s.h))<=tol;
}
function shapeAt(p,tol){for(let i=shapes.length-1;i>=0;i--)if(hit(shapes[i],p,tol))return shapes[i];return null}
function translate(o,dx,dy){const s=cl(o);if(s.points)s.points=s.points.map(([x,y])=>[x+dx,y+dy]);else if(s.start){s.start={x:s.start.x+dx,y:s.start.y+dy};s.end={x:s.end.x+dx,y:s.end.y+dy}}else{s.x+=dx;s.y+=dy}return s}
function scaleS(o,mx,my){
  const s=cl(o);
  if(s.points)s.points=s.points.map(([x,y])=>[mx(x),my(y)]);
  else if(s.start){s.start={x:mx(o.start.x),y:my(o.start.y)};s.end={x:mx(o.end.x),y:my(o.end.y)}}
  else{const a=mx(o.x),b=mx(o.x+o.w),c=my(o.y),d=my(o.y+o.h);s.x=Math.min(a,b);s.w=Math.max(1,Math.abs(b-a));s.y=Math.min(c,d);s.h=Math.max(1,Math.abs(d-c));if(s.type==='text'&&Math.abs(s.w-o.w)>.5)s.wrap=true}
  return s;
}

/* ---------- rendering ---------- */
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function tint(c,t,bg){const a=h2r(c),b=h2r(bg);return'#'+a.map((v,i)=>Math.round(b[i]+(v-b[i])*t).toString(16).padStart(2,'0')).join('')}
function rng(id){let h=7;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;return()=>{h=(Math.imul(h,1103515245)+12345)|0;return((h>>>8)&65535)/65535}}
function roughR(s){
  const R=rng(s.id),j=Math.min(3.5,Math.min(s.w,s.h)*.03+.8),r=()=>(R()-.5)*2*j;
  const c=[[s.x,s.y],[s.x+s.w,s.y],[s.x+s.w,s.y+s.h],[s.x,s.y+s.h]].map(([a,b])=>[a+r(),b+r()]);
  let d=`M${f(c[0][0])} ${f(c[0][1])}`;
  for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)%4];d+=`Q${f((a[0]+b[0])/2+r())} ${f((a[1]+b[1])/2+r())} ${f(b[0])} ${f(b[1])}`}
  return d+'Z';
}
function roughE(s){
  const R=rng(s.id),rx=s.w/2,ry=s.h/2,cx=s.x+rx,cy=s.y+ry,ph=R()*6.28,a=Math.min(.035,3/Math.max(Math.min(rx,ry),1)),n=48;let d='';
  for(let i=0;i<=n;i++){const t=i/n*Math.PI*2,k=1+a*Math.sin(2*t+ph)+a*.5*Math.sin(3*t+ph*2);d+=(i?'L':'M')+f(cx+Math.cos(t)*rx*k)+' '+f(cy+Math.sin(t)*ry*k)}
  return d+'Z';

function smooth(P){

  if(!mod&&!e.altKey&&e.target.tagName==='BUTTON'&&e.target.closest('#tabs')){
    if(k==='Enter'||k===' ')return; // let the focused page tab / add button activate
    const w=e.target.getAttribute('role')==='tab'&&e.target.parentNode;

    if(lk==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(lk==='y'){e.preventDefault();redo()}

  }
  if(e.altKey)return;

});

    if(d==='version'){toast(`지원하지 않는 lite-board 버전입니다 (version: ${o.version==null?'없음':o.version}).`,1);return{ok:false,error:'version'}}
    if(d==='schema'){toast(`lite-board 파일의 ${o.version===1?'shapes':'pages'}가 올바르지 않습니다.`,1);return{ok:false,error:'schema'}}
    const tot=d.pages.reduce((a,p)=>a+(p&&Array.isArray(p.shapes)?p.shapes.length:0),0),n=setDoc(d.pages,d.current,true);fit();
    toast(`${pages.length>1?pages.length+'개 페이지, ':''}${n}개 도형을 불러왔습니다.`);return{ok:true,imported:n,skipped:tot-n,pages:pages.length};
  }
  if(o&&!Array.isArray(o.records)&&o.document&&o.document.version!=null){toast('지원하지 않는 구버전 .tldr 파일입니다.',1);return{ok:false,error:'old-tldr'}}
  if(o&&Array.isArray(o.records)){
    const r=fromTldr(o),n=setDoc(r.pages,0,true);fit();
    toast(`${pages.length}개 페이지, ${n}개 도형을 가져왔고 ${r.skipped}개는 지원하지 않아 건너뜀`);return{ok:true,imported:n,skipped:r.skipped,pages:pages.length};
  }
  toast('지원하지 않는 파일 형식입니다.',1);return{ok:false,error:'format'};
}
const cmp=(a,b)=>{a=String(a==null?'':a);b=String(b==null?'':b);return a<b?-1:a>b?1:0};
function f16(h){const s=h>>15,e=(h>>10)&31,m=h&1023;if(e===0)return(s?-1:1)*m*2**-24;if(e===31)return m?NaN:(s?-1/0:1/0);return(s?-1:1)*2**(e-15)*(1+m/1024)}
function decodePath(b64,dim){
  const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  if(u8.length<8)return[];
  const dv=new DataView(u8.buffer),pts=[];let x=dv.getFloat32(0,true),y=dv.getFloat32(4,true);
  const head=dim===2?8:12,step=dim===2?4:6;pts.push([x,y]);
  for(let o=head;o+4<=u8.length;o+=step){x+=f16(dv.getUint16(o,true));y+=f16(dv.getUint16(o+2,true));pts.push([x,y])}
  return pts;
}
function richText(p){
  const r=p.richText;
  if(r&&typeof r==='object'){const walk=n=>!n?'':n.type==='text'?(n.text||''):n.type==='hardBreak'?'\n':(n.content||[]).map(walk).join('');return(Array.isArray(r.content)?r.content:[]).map(walk).join('\n')}
  return typeof p.text==='string'?p.text:'';
}
function tStyle(p){return{color:COLORS.includes(p.color)?p.color:p.color==='white'?'grey':'black',fill:FILLS.includes(p.fill)?p.fill:p.fill?'solid':'none',dash:DASHES.includes(p.dash)?p.dash:'draw',size:SIZES.includes(p.size)?p.size:'m'}}
function conv(s,ox,oy){
  const p=s.props||{},x=(+s.x||0)+ox,y=(+s.y||0)+oy,sc=+p.scale||1,style=tStyle(p),id=uid(),n=v=>Number.isFinite(+v)?+v:0;
  switch(s.type){
    case'geo':return{id,type:p.geo==='ellipse'||p.geo==='oval'?'ellipse':'rect',x,y,w:n(p.w)||100,h:(n(p.h)||100)+n(p.growY),text:richText(p),style};
    case'text':{const t={id,type:'text',x,y,w:(n(p.w)||100)*sc,h:10,text:richText(p),style};if(p.autoSize===false)t.wrap=true;return t}
    case'note':{const z=200*sc;if(style.color==='black')style.color='yellow';return{id,type:'note',x,y,w:z,h:z+n(p.growY)*sc,text:richText(p),style}}
    case'arrow':{const a=p.start||{},b=p.end||{};return{id,type:'arrow',start:{x:x+n(a.x),y:y+n(a.y)},end:{x:x+n(b.x),y:y+n(b.y)},style}}
    case'line':{
      const pts=(Array.isArray(p.points)?p.points.slice():Object.values(p.points||{})).filter(q=>q&&typeof q==='object');
      pts.sort((a,b)=>cmp(a.index,b.index));
      const P=pts.map(q=>[x+n(q.x),y+n(q.y)]);if(P.length<2)return null;
      if(P.length===2)return{id,type:'line',start:{x:P[0][0],y:P[0][1]},end:{x:P[1][0],y:P[1][1]},style};
      return{id,type:'draw',points:P,poly:true,style};
    }
    case'draw':case'highlight':{
      const kx=Number.isFinite(+p.scaleX)&&+p.scaleX?+p.scaleX:1,ky=Number.isFinite(+p.scaleY)&&+p.scaleY?+p.scaleY:1;let P=[];
      for(const g of Array.isArray(p.segments)?p.segments:[]){
        try{if(typeof g.path==='string')P=P.concat(decodePath(g.path,g.dim));else if(Array.isArray(g.points))P=P.concat(g.points.map(q=>[n(q.x),n(q.y)]))}catch(_){}
      }
      P=P.filter(q=>Number.isFinite(q[0])&&Number.isFinite(q[1])).map(([a,b])=>[f(a*kx+x),f(b*ky+y)]);
      return P.length?{id,type:'draw',points:P,style}:null;
    }
  }
  return null;
}
function fromTldr(file){
  const recs=file.records.filter(r=>r&&typeof r==='object');
  const pgs=recs.filter(r=>r.typeName==='page').sort((a,b)=>cmp(a.index,b.index));
  const pm=new Map(pgs.map((p,i)=>[p.id,{name:typeof p.name==='string'&&p.name.trim()?p.name:'Page '+(i+1),list:[]}])),one=pm.size?null:{name:'Page 1',list:[]};
  const byId=new Map(recs.filter(r=>r.typeName==='shape').map(r=>[r.id,r]));
  let skipped=0;
  for(const s of byId.values()){
    let ox=0,oy=0,keys=[s.index],par=s.parentId,g=0;
    while(par&&byId.has(par)&&g++<64){const q=byId.get(par);ox+=+q.x||0;oy+=+q.y||0;keys.unshift(q.index);par=q.parentId}
    const t=one||pm.get(par);if(!t){skipped++;continue}
    t.list.push({s,ox,oy,keys});
  }
  const out=(one?[one]:[...pm.values()]).map(p=>{
    p.list.sort((a,b)=>{for(let i=0;i<Math.min(a.keys.length,b.keys.length);i++){const c=cmp(a.keys[i],b.keys[i]);if(c)return c}return a.keys.length-b.keys.length});
    const sh=[];for(const{s,ox,oy}of p.list){if(s.type==='group')continue;const r=conv(s,ox,oy);if(r)sh.push(r);else skipped++}
    return{name:p.name,shapes:sh};
  });
  return{pages:out,skipped};
}

/* ---------- share via URL (no server: whole board deflated into the #fragment, never sent to any server) ---------- */
const r1=v=>Math.round(v*10)/10;
function shareObj(){layAll();return{app:'lite-board',version:2,current:pages.findIndex(p=>p.id===cur),pages:pages.map(p=>({name:p.name,shapes:p.shapes.map(s=>{const o={...s};delete o.id;if(o.points)o.points=o.points.map(p=>[r1(p[0]),r1(p[1])]);return o})}))}}
const b64u=u8=>{let b='';for(let i=0;i<u8.length;i+=32768)b+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s+'==='.slice((s.length+3)%4));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function pipe(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer())}
async function encodeShare(obj){return b64u(await pipe(new TextEncoder().encode(JSON.stringify(obj)),new CompressionStream('deflate-raw')))}
async function decodeShare(s){return JSON.parse(new TextDecoder().decode(await pipe(ub64u(s),new DecompressionStream('deflate-raw'))))}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(_){}try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}}
async function shareLink(){
  if(!nShapes()){toast('공유할 도형이 없습니다.',1);return null}
  let url;try{url=location.href.split('#')[0]+'#b='+await encodeShare(shareObj())}catch(_){toast('이 브라우저에서는 링크 공유를 만들 수 없습니다.',1);return null}
  const ok=await copyText(url),kb=Math.ceil(url.length/1024);
  if(!ok)history.replaceState(null,'',url);
  toast((ok?'공유 링크를 복사했습니다':'복사에 실패해 주소창에 링크를 넣었습니다. 주소창에서 복사하세요')+` (${kb}KB)${kb>32?'. 링크가 길어 일부 메신저에서 잘릴 수 있습니다':''}.`,!ok);
  return url;
}
async function openShared(){
  const m=/[#&]b=([A-Za-z0-9_-]+)/.exec(location.hash);if(!m)return false;
  history.replaceState(null,'',location.href.split('#')[0]);
  try{
    const d=docPages(await decodeShare(m[1]));if(!d||typeof d!=='object')throw 0;
    try{saveNow();const v=localStorage.getItem(KEY);if(v)localStorage.setItem(KEY+':before-share',v)}catch(_){}
    const n=setDoc(d.pages.map(p=>p&&Object.assign({},p,{camera:null})),d.current,true);fit();toast(`공유된 보드를 열었습니다(${pages.length>1?pages.length+'개 페이지, ':''}${n}개 도형). Ctrl+Z로 원래 보드로 돌아갈 수 있습니다.`);return true;
  }catch(_){toast('공유 링크가 손상되었거나 잘렸습니다.',1);return false}
}
addEventListener('hashchange',openShared);

/* ---------- boot ---------- */
try{const raw=localStorage.getItem(KEY),o=JSON.parse(raw||'null'),d=docPages(o);
  if(d&&typeof d==='object'){if(o.version===1&&!localStorage.getItem(KEY+':v1-backup'))localStorage.setItem(KEY+':v1-backup',raw);setDoc(d.pages,d.current,false)}
  else if(raw)localStorage.setItem(KEY+':unreadable-backup',raw)}catch(_){}
renderTabs();placeTabs();render();openShared();
window.__board={getDoc:()=>cl(docObj()),loadDoc:o=>loadDoc(o),importText:(t,n)=>importText(t,n),toTldr:()=>{layAll();return toTldr(pages)},shareLink:()=>shareLink(),
  addPage:n=>addPage(n),switchPage:v=>{const p=typeof v==='number'?pages[v]:pages.find(p=>p.id===v);if(p)goPage(p.id);return!!p},
  pages:()=>(sync(),pages.map(p=>({id:p.id,name:p.name,count:p.shapes.length})))};
})();
</script>
